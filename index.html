<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c10" />
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PF2e GM">
  <title>PF2e GM Toolkit</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1 id="view-title">PF2e GM</h1>
      <div class="party-chip">
        <label>Lvl <input id="party-level" type="number" min="1" max="20" value="1" /></label>
        <label>PCs <input id="party-size" type="number" min="1" max="8" value="4" /></label>
      </div>
    </header>

    <section id="view" class="view" aria-live="polite"></section>

    <nav class="tabbar" role="tablist">
      <button class="tab" data-view="home" role="tab">🏠<span>Home</span></button>
      <button class="tab" data-view="encounters" role="tab">⚔<span>Plan</span></button>
      <button class="tab" data-view="combat" role="tab">🎲<span>Combat</span></button>
      <button class="tab" data-view="library" role="tab">📖<span>Library</span></button>
      <button class="tab" data-view="loot" role="tab">💰<span>Loot</span></button>
      <button class="tab" data-view="notes" role="tab">📜<span>Notes</span></button>
      <button class="tab" data-view="party" role="tab">👥<span>Party</span></button>
    </nav>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
