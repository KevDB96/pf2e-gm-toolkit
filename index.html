<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c10" />
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PF2e GM">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- The same badge art as the tab icon, at 48px — the largest size a tab bar, a bookmark
       or a shortcut asks for. Deliberately not the 192px launcher file the manifest and the
       apple-touch-icon above use: that is 28 kB of shaded art to draw at 16, fetched on
       every cold load, and `npm run icons` writes this one from the same tile. Nothing
       needs it to lay the app out, so a browser that cannot fetch it just draws its own
       default. -->
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <title>PF2e GM Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded as a print stylesheet and switched over on arrival, which takes a
       cross-origin stylesheet off the critical path. Left blocking, it puts a DNS lookup, a
       TLS handshake and a round trip to fonts.googleapis.com in front of the first paint,
       and nothing is painted at all until it resolves — on a phone that is most of a
       second of empty screen. Nothing here needs the font to lay out: the families are
       requested with display=swap, so the app draws in the fallback metrics and reflows
       when the webfont lands. No noscript copy, because the whole shell is ES modules —
       with scripting off there is no app to style. -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1 id="view-title">PF2e GM</h1>
      <div class="party-chip">
        <label>Lvl <input id="party-level" type="number" min="1" max="20" value="1" /></label>
        <label>PCs <input id="party-size" type="number" min="1" max="8" value="4" /></label>
      </div>
    </header>
    <div id="session-phase-control" class="session-phase-control" role="group" aria-label="Session phase"></div>
    <div id="persistence" class="persistence" role="status" aria-live="polite" hidden>
      <span data-persistence-message></span>
      <button class="ghost" type="button" data-persistence-retry hidden>Retry</button>
      <button class="ghost" type="button" data-persistence-download hidden>Download current data</button>
      <button class="ghost" type="button" data-persistence-reset hidden>Start fresh</button>
    </div>

    <div class="subnav picker" id="subnav" role="tablist" hidden></div>
    <section id="view" class="view" aria-live="polite"></section>

    <nav class="tabbar" role="tablist">
      <button class="tab" data-view="home" role="tab">
        <img class="tab-icon" src="icons/nav/home.png" alt="" width="40" height="40">
        <span>Home</span>
      </button>
      <button class="tab" data-view="run" role="tab">
        <img class="tab-icon" src="icons/nav/run.png" alt="" width="40" height="40">
        <span>Run</span>
      </button>
      <button class="tab" data-view="table" role="tab">
        <img class="tab-icon" src="icons/nav/table.png" alt="" width="40" height="40">
        <span>Table</span>
      </button>
      <button class="tab" data-view="library" role="tab">
        <img class="tab-icon" src="icons/nav/library.png" alt="" width="40" height="40">
        <span>Library</span>
      </button>
      <button class="tab" data-view="sound" role="tab">
        <img class="tab-icon" src="icons/nav/bgm.png" alt="" width="40" height="40">
        <span>BGM</span>
      </button>
    </nav>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
